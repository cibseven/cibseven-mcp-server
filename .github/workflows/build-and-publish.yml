name: Build and publish
on:
  pull_request:
  push:
    branches: [main]
    # Release tags (e.g. 1.0.0) created by the Jenkins maven-release build. main only
    # ever holds a -SNAPSHOT, so the released version is published from its tag.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Explicit cache instead of setup-java's `cache: maven`: the built-in
      # maven cache aborts its save step with "Path Validation Error ... do(es)
      # not exist" even though ~/.m2/repository is populated. This step points
      # at a path that always exists after the build and runs on Node 24.
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Build and test
        # -U: force-check the remote repo for newer SNAPSHOTs. Without it, setup-java's
        # Maven cache (restored from a previous run, keyed on pom.xml's hash — unchanged
        # when only an upstream SNAPSHOT version is republished) can make Maven reuse a
        # stale cached cibseven-mcp-restapi jar instead of the new one.
        run: mvn -B -U verify
      # Build + push the image with jib (daemonless, no Dockerfile — the image is built
      # from the compiled classes and jib config in pom.xml). Publishes on a release tag
      # (version + latest), on main (dev SNAPSHOT), and on a manual workflow_dispatch;
      # on pull requests the job still builds/tests above.
      - name: Publish image
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: ./release.sh
        env:
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
